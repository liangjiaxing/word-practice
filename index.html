<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <title>Word Pronunciation Practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Word Pronunciation Practice</h1>
      <p class="subtitle">Listen to each word, record your pronunciation, and get a score.</p>

      <p id="supportInfo" class="support-info" role="status" aria-live="polite">Loading words...</p>

      <div class="mode-switch" role="tablist" aria-label="Practice mode">
        <button id="listModeBtn" class="mode-btn is-active" type="button" role="tab" aria-selected="true" aria-controls="listView">List</button>
        <button id="flashModeBtn" class="mode-btn" type="button" role="tab" aria-selected="false" aria-controls="flashView">Flash Card</button>
      </div>

      <section id="listView" class="view is-active" role="tabpanel" aria-labelledby="listModeBtn">
        <ul id="wordList" class="word-list" aria-label="Word list"></ul>
      </section>

      <section id="flashView" class="view flash-view" role="tabpanel" aria-labelledby="flashModeBtn" hidden>
        <div class="flash-shell">
          <button id="prevFlashBtn" class="flash-nav" type="button" aria-label="Previous word">&#8249;</button>
          <article id="flashCard" class="flash-card" tabindex="0" aria-live="polite">
            <span id="flashCounter" class="flash-counter"></span>
            <span id="flashWord" class="flash-word"></span>
            <div class="actions flash-actions">
              <button id="flashSpeakBtn" type="button">Hear</button>
              <button id="flashRecordBtn" type="button">Record</button>
            </div>
            <p id="flashResult" class="result flash-result" aria-live="polite"></p>
          </article>
          <button id="nextFlashBtn" class="flash-nav" type="button" aria-label="Next word">&#8250;</button>
        </div>
      </section>
    </main>

    <template id="wordItemTemplate">
      <li class="word-item">
        <span class="word-text"></span>
        <div class="actions">
          <button type="button" class="speak-btn">Hear</button>
          <button type="button" class="record-btn">Record</button>
        </div>
        <p class="result" aria-live="polite"></p>
      </li>
    </template>

    <script src="script.js"></script>
  </body>
</html>
